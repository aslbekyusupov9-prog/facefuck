name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools and platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > build_output.log 2>&1 || true
          
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Gradle build failed!"
            # Asosiy xatoni topamiz
            grep -A 20 "What went wrong:" build_output.log | while read line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-error-log
          path: android/build_output.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Face-Rating-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
