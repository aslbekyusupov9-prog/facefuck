name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Copy dist to android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Delete old KTS gradle files
        run: |
          rm -f android/settings.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/app/build.gradle.kts

      - name: Build APK with Gradle 8.5
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Face-Rating-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
