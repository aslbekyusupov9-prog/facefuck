name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools and platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/
          # Ensure old KTS files are deleted
          rm -f android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > build_output.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Gradle build failed! Displaying full log below:"
            cat build_output.log
            exit $EXIT_CODE
          else
            echo "Build successful!"
            cat build_output.log | tail -n 50
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Face-Rating-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
